<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <rect width="160" height="160" rx="16" fill="#f6f1fb"/>
  <!-- curly body -->
  <g fill="#efe4f7">
    <circle cx="60" cy="120" r="18"/>
    <circle cx="82" cy="126" r="18"/>
    <circle cx="103" cy="119" r="16"/>
    <circle cx="70" cy="105" r="17"/>
    <circle cx="93" cy="105" r="17"/>
  </g>
  <!-- legs -->
  <rect x="60" y="132" width="10" height="18" rx="5" fill="#e6d8f2"/>
  <rect x="94" y="132" width="10" height="18" rx="5" fill="#e6d8f2"/>
  <!-- ears -->
  <ellipse cx="52" cy="80" rx="12" ry="20" fill="#e6d8f2" transform="rotate(-12 52 80)"/>
  <ellipse cx="108" cy="80" rx="12" ry="20" fill="#e6d8f2" transform="rotate(12 108 80)"/>
  <!-- head -->
  <circle cx="80" cy="68" r="30" fill="#f3ebfa"/>
  <!-- topknot -->
  <circle cx="80" cy="38" r="13" fill="#e6d8f2"/>
  <circle cx="67" cy="43" r="10" fill="#e6d8f2"/>
  <circle cx="93" cy="43" r="10" fill="#e6d8f2"/>
  <!-- muzzle -->
  <ellipse cx="80" cy="83" rx="16" ry="11" fill="#ffffff"/>
  <!-- eyes -->
  <circle cx="69" cy="64" r="4.5" fill="#3d3348"/>
  <circle cx="91" cy="64" r="4.5" fill="#3d3348"/>
  <!-- nose -->
  <ellipse cx="80" cy="79" rx="5.5" ry="4.5" fill="#3d3348"/>
  <!-- mouth -->
  <path d="M80 83 v5 M80 88 q-6 4 -10 0 M80 88 q6 4 10 0" stroke="#3d3348" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
