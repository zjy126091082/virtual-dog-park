<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <rect width="160" height="160" rx="16" fill="#f3ece2"/>
  <!-- body -->
  <ellipse cx="80" cy="120" rx="42" ry="25" fill="#e8d9c5"/>
  <!-- legs -->
  <rect x="58" y="130" width="10" height="18" rx="5" fill="#dccbb3"/>
  <rect x="92" y="130" width="10" height="18" rx="5" fill="#dccbb3"/>
  <!-- ears -->
  <ellipse cx="46" cy="72" rx="14" ry="26" fill="#8a5a34" transform="rotate(-12 46 72)"/>
  <ellipse cx="114" cy="72" rx="14" ry="26" fill="#8a5a34" transform="rotate(12 114 72)"/>
  <!-- head -->
  <circle cx="80" cy="66" r="34" fill="#f6e7c8"/>
  <!-- brown cap over the head -->
  <path d="M46 60 a34 34 0 0 1 68 0 q-14 -14 -34 -14 q-20 0 -34 14 z" fill="#a97041"/>
  <!-- muzzle -->
  <ellipse cx="80" cy="82" rx="18" ry="12" fill="#ffffff"/>
  <!-- eyes -->
  <circle cx="68" cy="62" r="4.5" fill="#3a2f28"/>
  <circle cx="92" cy="62" r="4.5" fill="#3a2f28"/>
  <!-- nose -->
  <ellipse cx="80" cy="78" rx="6" ry="4.5" fill="#3a2f28"/>
  <!-- mouth -->
  <path d="M80 82 v6 M80 88 q-7 5 -12 0 M80 88 q7 5 12 0" stroke="#3a2f28" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
